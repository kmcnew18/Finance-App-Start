<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Log in · Arko</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Jura&family=Fraunces:opsz,wght@9..144,300;9..144,500;9..144,600&family=Public+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="signup.css" />
  <link rel="icon" href="favicon.ico" sizes="any" />
  <link rel="icon" type="image/png" href="favicon.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="favicon-192.png" />
  <link rel="icon" type="image/png" sizes="512x512" href="favicon-512.png" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <link rel="manifest" href="manifest.json" />
  <link rel="stylesheet" href="transitions.css" />
  <link rel="stylesheet" href="ambient.css" />
  <script src="transitions.js"></script>
  <script src="password-toggle.js"></script>
  <script src="ambient.js"></script>
  <meta name="theme-color" content="#0D1117" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Arko" />
</head>
<body>

  <header class="hero">
    <nav class="nav">
      <a href="index.html" class="wordmark" style="text-decoration: none;"><img src="favicon-192.png" alt="" class="wordmark-mark" width="28" height="28" /><span class="wordmark-brand">Arko</span> | Finance</a>
      <div class="nav-auth">
        <button type="button" class="btn-signup" onclick="ArkoTransitions.go('signup.html')">Sign up</button>
      </div>
    </nav>


    <div class="auth-content">
      <h1>Welcome back</h1>
      <p class="auth-subhead">Log in to see your full picture.</p>

      <form class="auth-form" id="login-form">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" placeholder="you@email.com" autocomplete="email" autofocus required />

        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="Your password" autocomplete="current-password" required minlength="8" />

        <button type="submit" id="login-button">Log in</button>
      </form>

      <p class="auth-switch"><a href="forgot-password.html">Forgot password?</a></p>

      <p class="auth-message" id="auth-message" aria-live="polite"></p>

      <button type="button" id="resend-button" class="btn-resend" style="display:none;">Resend confirmation email</button>

      <p class="auth-switch">Don't have an account? <a href="signup.html">Sign up</a></p>
    </div>
  </header>

  <script src="https://openfpcdn.io/fingerprintjs/v4/iife.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script>
    const SUPABASE_URL = "https://pkfkdmjuwkfkbkmlmoxq.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBrZmtkbWp1d2tma2JrbWxtb3hxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODMyNzIxMTIsImV4cCI6MjA5ODg0ODExMn0.MWUcOvwttx1y0iE_Rcc6aUoJ7F5jmT-mMrQfOTwqmOY";

    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const form = document.getElementById('login-form');
    const button = document.getElementById('login-button');
    const message = document.getElementById('auth-message');
    const resendButton = document.getElementById('resend-button');

    let lastLoginEmail = '';

    // Where to go after signing in: back to the app page that sent you
    // here (idle sign-out, an expired session, Log out) rather than
    // always the Dashboard. Taken from ?next= or the referring page, and
    // only ever one of Arko's own app pages on this origin — anything
    // else falls back to the Dashboard, so this can't be used as an
    // open redirect.
    const APP_PAGE_RE = /^\/(dashboard|connections|budget|log|spending|investments|savings)(\.html)?$/;
    function safeReturnPath(raw) {
      if (!raw) return null;
      try {
        const u = new URL(raw, location.origin);
        if (u.origin !== location.origin || !APP_PAGE_RE.test(u.pathname)) return null;
        return u.pathname + u.search;
      } catch (e) { return null; }
    }
    const returnTo = (() => {
      const fromParam = safeReturnPath(new URLSearchParams(location.search).get('next'));
      const fromReferrer = safeReturnPath(document.referrer);
      const remembered = (() => { try { return safeReturnPath(sessionStorage.getItem('arko_return_to')); } catch (e) { return null; } })();
      const chosen = fromParam || fromReferrer || remembered;
      try { if (chosen) sessionStorage.setItem('arko_return_to', chosen); } catch (e) {}
      return chosen;
    })();
    function goAfterLogin() {
      try { sessionStorage.removeItem('arko_return_to'); } catch (e) {}
      ArkoTransitions.go(returnTo || 'dashboard.html');
    }

    // Starts the 14-day trial the first time an account signs in (the
    // server makes it a no-op every time after). Fingerprinting is
    // wrapped in its own try/catch so a blocked script (ad blockers /
    // Brave / Firefox commonly block it) never prevents login or trial
    // registration from completing.
    async function registerTrial(userId, accessToken) {
      let visitorId = null;
      try {
        const fp = await FingerprintJS.load();
        const fpResult = await fp.get();
        visitorId = fpResult.visitorId;
      } catch (fpErr) {
        console.warn('Fingerprint unavailable (likely blocked by browser/extension):', fpErr);
      }
      try {
        if (!accessToken) {
          const { data: { session } } = await supabaseClient.auth.getSession();
          accessToken = session && session.access_token;
        }
        const trialRes = await fetch('/api/register-trial', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', ...(accessToken ? { 'Authorization': `Bearer ${accessToken}` } : {}) },
          body: JSON.stringify({ userId, fingerprint: visitorId })
        });
        if (!trialRes.ok) {
          const errBody = await trialRes.text();
          console.error('register-trial failed:', trialRes.status, errBody);
        }
      } catch (regErr) {
        console.warn('Trial registration request failed:', regErr);
      }
    }

    // Already signed in? Skip the form. This is also the path a brand-new
    // account takes: the email-confirmation link lands here already
    // signed in, so the trial has to be started on this path too.
    supabaseClient.auth.getUser().then(async ({ data }) => {
      if (!data || !data.user) return;
      await registerTrial(data.user.id);
      goAfterLogin();
    }).catch(() => {});

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      message.textContent = '';
      message.className = 'auth-message';
      resendButton.style.display = 'none';

      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      lastLoginEmail = email;

      button.disabled = true;
      button.textContent = 'Logging in...';

      try {
        const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });

        if (error) {
          console.error('Login error:', error);
          if (error.message.toLowerCase().includes('email not confirmed')) {
            message.textContent = "Please confirm your email before logging in. Check your inbox.";
            resendButton.style.display = 'inline-block';
          } else {
            message.textContent = error.message || 'Invalid email or password.';
          }
          message.classList.add('auth-message-error');
          return;
        }

        message.textContent = "Logged in! Redirecting...";
        message.classList.add('auth-message-success');

        // Register (or check) trial status before redirecting.
        await registerTrial(data.user.id, data.session && data.session.access_token);

        // Don't navigate on a blind timer — confirm the session is
        // actually retrievable first. signInWithPassword() resolving
        // doesn't guarantee the session has finished persisting to
        // storage yet, and mobile browsers (particularly Safari) are
        // markedly less forgiving about that kind of timing race on
        // navigation than desktop — a fixed delay that happens to work
        // reliably on desktop can still lose the race often enough on
        // mobile to look like "login just bounces back to login."
        // Polling getSession() a few times closes that race regardless
        // of the exact platform-specific storage timing at play.
        let sessionConfirmed = false;
        for (let attempt = 0; attempt < 10; attempt++) {
          const { data: { session } } = await supabaseClient.auth.getSession();
          if (session) { sessionConfirmed = true; break; }
          await new Promise(r => setTimeout(r, 150));
        }

        if (!sessionConfirmed) {
          message.textContent = "Logged in, but your session isn't ready yet — tap Log in again in a moment.";
          message.classList.add('auth-message-error');
          return;
        }

        goAfterLogin();

      } catch (err) {
        console.error('Unexpected error:', err);
        message.textContent = 'Network error — please check your connection and try again.';
        message.classList.add('auth-message-error');
      } finally {
        button.disabled = false;
        button.textContent = 'Log in';
      }
    });

    resendButton.addEventListener('click', async () => {
      if (!lastLoginEmail) return;

      resendButton.disabled = true;
      resendButton.textContent = 'Sending...';

      try {
        const { error } = await supabaseClient.auth.resend({
          type: 'signup',
          email: lastLoginEmail,
          options: {
            emailRedirectTo: window.location.origin + '/login.html'
          }
        });

        if (error) {
          console.error('Resend error:', error);
          message.textContent = error.message || 'Could not resend email. Please try again.';
          message.classList.add('auth-message-error');
        } else {
          message.textContent = "Confirmation email resent. Check your inbox.";
          message.className = 'auth-message auth-message-success';
        }
      } catch (err) {
        console.error('Unexpected resend error:', err);
        message.textContent = 'Network error — please try again.';
        message.classList.add('auth-message-error');
      } finally {
        resendButton.disabled = false;
        resendButton.textContent = 'Resend confirmation email';
      }
    });
  </script>

</body>
</html>
